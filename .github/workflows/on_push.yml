name: Build & Test
on: push

jobs:
  build_exe:
    name: Windows portable build
    runs-on: windows-latest
    steps:
      - uses: pdm-project/setup-pdm@v4
        with:
            python-version: "3.14"
      - name: Install Just
        run: choco install -y just
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: just prepare
      - run: just --evaluate
      - run: just test
      - run: just bump_version_git build win32_portable
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: librebuds_win32
          path: .\dist\*
          if-no-files-found: error

  build_deb:
    name: Run PyTest and build Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: pdm-project/setup-pdm@v4
        with:
            python-version: "3.14"
            cache: true
      - name: Install Just
        run: pip install -U --break-system-packages rust-just
      - name: Do APT update
        run: sudo apt update
      - name: Install project dependencies
        run: just deps_debian prepare
      - run: just --evaluate
      - run: just test
      - run: just bump_version_git build debian
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: librebuds_debian
          path: ./dist/*
          if-no-files-found: error
